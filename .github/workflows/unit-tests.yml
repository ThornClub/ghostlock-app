name: Unit tests

on:
  push:
    branches-ignore:
      - ci-report
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # 单测只编译 JVM 侧; 这个 job 证明 APK 能真的打包出来 (AIDL stub、资源合并、native 预处理)。
  build-debug-apk:
    name: Build debug + release APK
    runs-on: ubuntu-latest
    env:
      ONDK_VERSION: "r30.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache ONDK
        id: ondk-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ondk
          key: ondk-${{ env.ONDK_VERSION }}-linux

      - name: Download ONDK
        if: steps.ondk-cache.outputs.cache-hit != 'true'
        run: |
          url="https://github.com/topjohnwu/ondk/releases/download/${ONDK_VERSION}/ondk-${ONDK_VERSION}-linux.tar.xz"
          mkdir -p "${{ runner.temp }}/ondk"
          curl -fL "$url" -o "${{ runner.temp }}/ondk.tar.xz"
          tar -C "${{ runner.temp }}/ondk" --strip-components=1 -xf "${{ runner.temp }}/ondk.tar.xz"

      - name: Link ONDK Rust toolchain
        run: rustup toolchain link ondk "${{ runner.temp }}/ondk/toolchains/rust"

      - name: Assemble debug
        run: |
          export ONDK_HOME="${{ runner.temp }}/ondk"
          export ANDROID_NDK_HOME="$ONDK_HOME"
          export NDK_ROOT="$ONDK_HOME"
          export CC_aarch64_linux_android="$ONDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          export AR_aarch64_linux_android="$ONDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          ./gradlew :app:assembleDebug --no-daemon
          # release 走 R8/资源收缩; 新增的 AIDL 方法也必须能在收缩后存活
          ./gradlew :app:assembleRelease --no-daemon

  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # preBuild deliberately does not depend on the native tasks
      # (app/build.gradle.kts), so JVM unit tests need neither the NDK nor cargo.
      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon 2>&1 | tee "$RUNNER_TEMP/unit-tests.log"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-report
          path: build/app/reports/tests
          if-no-files-found: ignore

      # 包装器日志默认要 token 才能读; 把失败摘要推到 ci-report 分支, 任何人有仓读权限就能看。
      - name: Publish failure report
        if: failure()
        run: |
          {
            echo "# unit-tests failure"
            echo
            echo "sha: $GITHUB_SHA"
            echo
            echo '```'
            grep -nE "^e: |error:|FAILURE:|What went wrong|Caused by|SDK|Could not resolve|Could not find" \
              "$RUNNER_TEMP/unit-tests.log" | head -40 || true
            echo '```'
            echo
            echo '```'
            tail -n 100 "$RUNNER_TEMP/unit-tests.log"
            echo '```'
            echo
            echo "## JUnit failure details"
            echo
            echo '```'
            find build -path '*test-results*' -name '*.xml' -print 2>/dev/null | head -5
            echo '---'
            find build -path '*test-results*' -name '*.xml' -exec grep -h -A6 '<failure' {} + 2>/dev/null | head -100 || true
            echo '```'
          } > ci-report.md
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b ci-report
          git add -f ci-report.md
          git commit -q -m "ci: unit-test failure report for ${GITHUB_SHA::7}"
          git push --force origin ci-report
